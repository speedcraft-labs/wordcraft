name: Hosted CI
on:
  push:
    branches: [main, algo/ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: speedcraft-labs/craft-i18n
          path: craft-i18n
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config libdbus-1-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev fonts-noto-core fonts-noto-cjk fonts-unifont
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - name: Workspace tests
        run: cargo test --workspace --no-fail-fast
